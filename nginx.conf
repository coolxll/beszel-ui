server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA. /api/* is NOT proxied here: the browser talks to
    # VITE_BESZEL_URL directly, so CORS must be allowed on the Beszel hub.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache-bust hashed assets aggressively, never cache index.html.
    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
